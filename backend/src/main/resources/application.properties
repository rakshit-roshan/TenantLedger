# ==============================================================================
# Gharkhata Backend Configuration (Simple Line-by-Line Properties)
# ==============================================================================

# Server Port & Context Path
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# Application Name
spring.application.name=${APP_NAME:gharkhata-backend}

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gharkhata}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:escan_123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=GharkhataHikariPool

# JPA & Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Gharkhata JWT Security
gharkhata.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
gharkhata.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
gharkhata.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

