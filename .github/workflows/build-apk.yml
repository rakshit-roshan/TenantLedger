name: Build Gharkhata Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Gradle Wrapper
        working-directory: ./android
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/Gharkhata.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/Gharkhata.apk || cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Gharkhata.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gharkhata-Android-APK
          path: build-output/Gharkhata.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Gharkhata Mobile App v1.0.0 (Android)
          body: |
            ## Gharkhata Mobile App (Android APK)
            - **Web Application**: https://tenant-ledger.vercel.app/
            - **Branding**: Official Gharkhata terracotta branding and high-res icon.
            - **Native Features**: Offline caching, document upload chooser (rent agreements, KYC), pull-to-refresh, back navigation.

            ### How to Install:
            1. Download `Gharkhata.apk` below on your Android phone.
            2. Tap to install (enable "Install unknown apps" if prompted).
            3. Open Gharkhata directly from your home screen.
          files: build-output/Gharkhata.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

